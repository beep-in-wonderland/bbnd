[package]
name = "wesad"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
daemonize = "0.5.0"
directories = "6.0.0"
fancy-regex = "0.20.0"
fern = "0.7.1"
json = "0.12.4"
log = "0.4.34"
reqwest = {version = "0.13.5", features=["blocking"]}
serde = {version = "1.0.229", features=["derive"]}
sqlite = "0.37.4"
thiserror = "2.0.21"
tokio = {version = "1.53.2", features = ["rt", "rt-multi-thread"]}
